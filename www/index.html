<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17162b">
<title>Slidely</title>
<style>
:root{
  --bg:#f2f3f8; --panel:#ffffff; --ink:#1c1b2e; --mute:#77778d; --line:#e7e6ef;
  --acc:#6956e8; --accsoft:#efedff; --danger:#d94b63;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;height:100dvh;padding-top:var(--sat)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button:focus-visible{outline:3px solid rgba(105,86,232,.36);outline-offset:2px}

header{display:flex;align-items:center;gap:8px;height:62px;padding:0 12px 0 16px;background:#17162b;color:#fff;
  border-bottom:1px solid rgba(255,255,255,.08);flex:none;box-shadow:0 4px 18px rgba(24,20,52,.12);z-index:2}
header h1{display:flex;align-items:center;gap:9px;margin:0;font-size:18px;font-weight:750;letter-spacing:-.035em}
header h1::before{content:"S";display:grid;place-items:center;width:30px;height:30px;border-radius:10px;
  background:linear-gradient(145deg,#a594ff,#7058ed);color:#fff;font-size:16px;font-weight:800;box-shadow:0 4px 12px rgba(112,88,237,.35)}
.sp{flex:1}
.hb{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:13px;font-size:13px;font-weight:650;transition:transform .15s,background .15s}
.hb:active{transform:scale(.97)}
.hb.ghost{background:rgba(255,255,255,.1);color:#f0efff}
.hb.main{background:linear-gradient(135deg,#8670ff,#6551e6);color:#fff;box-shadow:0 5px 14px rgba(99,79,225,.3)}
.hb svg{width:18px;height:18px}
.hb.icon{width:38px;min-width:38px;justify-content:center;padding:0}
.hb.icon:disabled{opacity:.38;cursor:default}
.hb.icon .hb-label{display:none}
#lang{min-width:44px;justify-content:center}

#canvas{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;padding:12px;
  background-color:#f3f2f8;background-image:radial-gradient(#d7d4e4 1px,transparent 1px);background-size:18px 18px}
#box{position:relative}
#stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;direction:ltr;
  overflow:hidden;touch-action:none;box-shadow:0 18px 48px rgba(36,30,68,.2),0 2px 8px rgba(36,30,68,.1);border-radius:8px}
.el{position:absolute;touch-action:none}
.el.text{display:flex;align-items:center;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.2;font-family:Arial,Roboto,sans-serif}
.el img{width:100%;height:100%;display:block;pointer-events:none}
#stage .el.sel{outline:var(--ow,2px) solid var(--acc)}
.handle{position:absolute;right:0;bottom:0;width:var(--hs,34px);height:var(--hs,34px);background:var(--acc);
  border-radius:var(--hs,34px) 0 0 0;touch-action:none;box-shadow:0 0 0 2px #fff}

#ctx{display:none;flex:none;align-items:center;gap:7px;padding:8px 12px;background:var(--panel);
  border-top:1px solid var(--line);overflow-x:auto;box-shadow:0 -5px 18px rgba(34,30,64,.04);scrollbar-width:none}
#ctx::-webkit-scrollbar,#strip::-webkit-scrollbar{display:none}
#ctx.on{display:flex}
#ctx button{display:flex;align-items:center;justify-content:center;gap:4px;height:38px;min-width:42px;padding:0 12px;border-radius:10px;
  background:#f3f2f8;font-size:13px;font-weight:650;flex:none;transition:background .15s,color .15s}
#ctx button.on{background:var(--accsoft);color:var(--acc)}
#ctx button.danger{color:var(--danger)}
#ctx .swb{width:38px;padding:0;border:2px solid #dedce9}
#ctx .sz{min-width:26px;text-align:center;font-weight:600;font-size:14px;flex:none}
#ctx select{height:38px;min-width:92px;padding:0 9px;border:0;border-radius:10px;background:#f3f2f8;
  color:var(--ink);font-family:inherit;font-size:12px;font-weight:600;flex:none}

#strip{display:flex;gap:11px;flex:none;padding:12px 14px;background:#fbfaff;border-top:1px solid var(--line);
  overflow-x:auto;direction:ltr;scrollbar-width:none}
.thumb{position:relative;width:144px;height:81px;flex:none;border-radius:8px;overflow:hidden;background:#fff;border:2px solid transparent;
  box-shadow:0 2px 8px rgba(35,30,65,.12);transition:border-color .16s,transform .16s,box-shadow .16s}
.thumb:active{transform:scale(.98)}
.thumb.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(105,86,232,.16),0 4px 12px rgba(35,30,65,.13)}
.thumb .mini{position:absolute;left:0;top:0;width:960px;height:540px;transform:scale(.15);transform-origin:0 0;pointer-events:none}
.thumb span{position:absolute;left:6px;bottom:5px;font-size:10px;font-weight:750;color:#fff;background:rgba(23,22,43,.72);
  padding:2px 7px;border-radius:7px;backdrop-filter:blur(6px)}
.thumb.add{display:grid;place-items:center;background:#f4f2ff;border:1.5px dashed #b9b1ed;box-shadow:none;color:var(--acc)}
.thumb.add svg{width:25px;height:25px}

#tools{display:flex;flex:none;background:var(--panel);border-top:1px solid var(--line);padding:4px 5px calc(4px + var(--sab));
  box-shadow:0 -8px 24px rgba(34,30,64,.06)}
#tools button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:58px;
  border-radius:13px;font-size:11px;font-weight:650;letter-spacing:.01em;color:var(--mute);transition:color .15s,background .15s,transform .15s}
#tools button svg{width:21px;height:21px}
#tools button:active{color:var(--acc);background:var(--accsoft);transform:translateY(-1px)}

#scrim{position:fixed;inset:0;display:none;background:rgba(24,20,48,.36);backdrop-filter:blur(2px);z-index:20}
#scrim.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--panel);border-radius:22px 22px 0 0;
  padding:20px 18px calc(18px + var(--sab));box-shadow:0 -12px 40px rgba(28,24,58,.2);
  transform:translateY(110%);transition:transform .2s ease-out;max-height:80dvh;overflow-y:auto}
#sheet.on{transform:none}
#sheet textarea{width:100%;min-height:110px;font:inherit;font-size:18px;padding:12px;border:1.5px solid var(--line);border-radius:12px;resize:none;
  -webkit-user-select:text;user-select:text;color:var(--ink);background:#fbfaff;outline:none}
#sheet textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(105,86,232,.12)}
.primary{width:100%;height:50px;margin-top:12px;border-radius:13px;background:linear-gradient(135deg,#806bfa,#6551e6);
  color:#fff;font-weight:700;font-size:15px;box-shadow:0 6px 16px rgba(105,86,232,.22)}
.row{display:flex;align-items:center;gap:12px;width:100%;height:52px;padding:0 8px;font-size:15px;font-weight:650;
  border-bottom:1px solid #f0eff5;text-align:start}
.row:last-child{border-bottom:0}
.row.danger{color:var(--danger)}
.shapes{display:flex;gap:14px;justify-content:space-around}
.shapes button{width:92px;height:92px;border-radius:17px;background:#f3f2f8;display:grid;place-items:center}
.shapes i{display:block;width:54px;height:40px;background:var(--acc)}
.sheetTitle{margin:0 0 13px;font-size:15px;font-weight:750;letter-spacing:-.01em}
.layouts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.layoutCard{min-width:0;padding:8px;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:left}
.layoutCard:active{background:var(--accsoft)}
.layoutPreview{position:relative;display:block;width:100%;height:72px;margin-bottom:8px;overflow:hidden;
  border:1px solid #e6e4ef;border-radius:8px;background:#fff}
.layoutPreview::before,.layoutPreview::after{content:"";position:absolute;display:block;border-radius:5px;background:#d9d6e9}
.layoutPreview::before{left:14%;top:19%;width:66%;height:12%;background:#6956e8}
.layoutPreview::after{left:14%;top:43%;width:72%;height:7%;box-shadow:0 11px 0 #e7e5ef,0 22px 0 #e7e5ef}
.layoutPreview.blank::before,.layoutPreview.blank::after{display:none}
.layoutPreview.titleOnly::after{left:28%;top:48%;width:44%;height:8%;box-shadow:none}
.layoutPreview.section::before{left:20%;top:35%;width:60%;height:15%}
.layoutPreview.section::after{left:32%;top:61%;width:36%;height:6%;box-shadow:none}
.layoutPreview.twoColumns{background:linear-gradient(90deg,#fff 0 48%,#efedf5 48% 52%,#fff 52%)}
.layoutPreview.twoColumns::after{left:9%;top:43%;width:31%;height:7%;box-shadow:0 11px 0 #e7e5ef,0 22px 0 #e7e5ef}
.layoutLabel{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:700}
.templateGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.templateCard{min-width:0;padding:8px;border:1px solid var(--line);border-radius:15px;background:#fff;text-align:left}
.templateCard:active{transform:scale(.985);background:var(--accsoft)}
.templatePreview{position:relative;display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:16/9;overflow:hidden;
  padding:10px;border-radius:10px;color:#fff;isolation:isolate}
.templatePreview::before{content:"";position:absolute;z-index:-1;right:-18px;top:-28px;width:90px;height:90px;border-radius:50%;background:var(--preview-accent)}
.templatePreview::after{content:"";position:absolute;z-index:-1;left:10px;top:10px;width:22px;height:3px;border-radius:5px;background:var(--preview-accent)}
.templatePreview.pitch{--preview-accent:#8c73ff;background:#20203e}
.templatePreview.portfolio{--preview-accent:#e98568;background:#fbf0e6;color:#382a25}
.templatePreview.lesson{--preview-accent:#3185d8;background:#eaf4ff;color:#173658}
.templatePreview.launch{--preview-accent:#55cfb3;background:#102d38}
.templatePreview .miniTitle{max-width:78%;font-size:12px;line-height:1.05;font-weight:800;letter-spacing:-.025em}
.templatePreview .miniSub{margin-top:4px;font-size:7px;line-height:1.15;opacity:.78}
.templateInfo{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-top:8px}
.templateName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:750}
.templateSlides{flex:none;color:var(--mute);font-size:10px;font-weight:600}
.templateHint{margin:-5px 0 14px;color:var(--mute);font-size:12px;line-height:1.4}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.themes button{height:84px;border-radius:15px;border:1.5px solid var(--line);display:flex;align-items:flex-end;padding:8px 10px;font-weight:700;font-size:14px}
.themes button.on{outline:3px solid var(--acc);outline-offset:1px}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.pal button{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);box-shadow:0 2px 5px rgba(30,25,60,.08)}
.custom{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-weight:600}
.custom input{width:64px;height:40px;border:0;background:none;padding:0}

#pres{position:fixed;inset:0;z-index:50;background:#000;display:none;touch-action:none}
#pres.on{display:block}
#pstage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;direction:ltr;overflow:hidden}
#pclose{position:absolute;top:calc(12px + var(--sat));right:12px;width:44px;height:44px;border-radius:15px;
  background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;opacity:.78;backdrop-filter:blur(8px)}
#pnum{position:absolute;bottom:calc(12px + var(--sab));left:50%;transform:translateX(-50%);text-align:center;color:#fff;
  background:rgba(255,255,255,.14);padding:5px 12px;border-radius:20px;opacity:.8;font-size:12px;font-weight:650;pointer-events:none}

#toast{position:fixed;left:50%;bottom:calc(150px + var(--sab));transform:translateX(-50%);max-width:88%;background:var(--ink);color:#fff;padding:11px 18px;border-radius:22px;
  font-size:13px;font-weight:650;z-index:60;display:none;text-align:center;box-shadow:0 7px 20px rgba(20,18,42,.22)}
#toast.on{display:block}

@media(max-width:380px){
  header{gap:5px;padding-left:12px;padding-right:8px}
  header h1{font-size:16px;gap:7px}
  header h1::before{width:27px;height:27px;border-radius:9px}
  .hb{gap:4px;padding:0 9px;font-size:12px}
  .hb.icon{width:32px;min-width:32px}
  #lang{min-width:38px}
  #strip{gap:9px;padding-left:10px;padding-right:10px}
  .thumb{width:128px;height:72px}
  .thumb .mini{transform:scale(.13333)}
  #tools button{font-size:10px}
}
@media(max-width:420px){
  header .hb:not(.icon):not(#lang){width:36px;min-width:36px;padding:0;justify-content:center}
  header .hb:not(.icon):not(#lang) span{display:none}
}
@media(max-width:340px){
  header{gap:4px;padding-left:8px;padding-right:7px}
  header h1{font-size:15px}
  header .hb:not(.icon){width:32px;min-width:32px;padding:0;justify-content:center}
  header .hb:not(.icon) span{display:none}
  .hb.icon{width:29px;min-width:29px}
  #lang{min-width:32px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<header>
  <h1>Slidely</h1>
  <div class="sp"></div>
  <button class="hb ghost" id="lang"></button>
  <button class="hb ghost icon" id="undo" data-a="undo"><i data-ic="undo"></i><span class="hb-label" data-t="undo"></span></button>
  <button class="hb ghost icon" id="redo" data-a="redo"><i data-ic="redo"></i><span class="hb-label" data-t="redo"></span></button>
  <button class="hb ghost" data-a="present"><i data-ic="play"></i><span data-t="present"></span></button>
  <button class="hb main" data-a="export"><i data-ic="export"></i><span data-t="export"></span></button>
</header>

<main id="canvas"><div id="box"><div id="stage"></div></div></main>

<div id="ctx"></div>
<div id="strip"></div>

<nav id="tools">
  <button data-a="templates"><i data-ic="templates"></i><span data-t="templates"></span></button>
  <button data-a="addtext"><i data-ic="text"></i><span data-t="text"></span></button>
  <button data-a="shape"><i data-ic="shape"></i><span data-t="shape"></span></button>
  <button data-a="image"><i data-ic="image"></i><span data-t="image"></span></button>
  <button data-a="theme"><i data-ic="theme"></i><span data-t="theme"></span></button>
  <button data-a="slide"><i data-ic="slide"></i><span data-t="slide"></span></button>
</nav>

<div id="scrim" data-a="close"></div>
<div id="sheet"></div>

<div id="pres">
  <div id="pstage"></div>
  <button id="pclose" aria-label="Close"><i data-ic="x"></i></button>
  <div id="pnum"></div>
</div>

<div id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>

<script src="lib/pptxgen.bundle.js"></script>

function checkpoint(){
  undoStack.push(JSON.stringify(S));
  if(undoStack.length>MAX_HISTORY)undoStack.shift();
  redoStack.length=0;syncHistoryButtons();
}
function recordUndo(before){
  if(before===JSON.stringify(S))return;
  undoStack.push(before);
  if(undoStack.length>MAX_HISTORY)undoStack.shift();
  redoStack.length=0;syncHistoryButtons();
}
function restoreHistory(from,to){
  if(!from.length)return;
  if($('#sheet').classList.contains('on'))closeSheet();
  to.push(JSON.stringify(S));
  S=JSON.parse(from.pop());sel=null;syncHistoryButtons();renderAll();save();
}

/* ---------- rendering ---------- */
function makeNode(el){
  const d=document.createElement('div');
  d.className='el '+el.type;d.dataset.id=el.id;
  d.style.left=el.x+'px';d.style.top=el.y+'px';d.style.width=el.w+'px';d.style.height=el.h+'px';
  if(el.type==='text'){
    d.textContent=el.text;d.dir='auto';
    d.style.fontSize=el.size+'px';d.style.color=el.color;d.style.fontWeight=el.bold?'700':'400';
    d.style.fontFamily=el.font||'Arial';d.style.fontStyle=el.italic?'italic':'normal';
    d.style.textDecoration=el.underline?'underline':'none';
    d.style.textAlign=el.align;
    d.style.justifyContent={left:'flex-start',center:'center',right:'flex-end'}[el.align]||'center';
  }else if(el.type==='image'){
    const im=document.createElement('img');im.src=el.data;im.draggable=false;d.appendChild(im);
  }else{
    d.style.background=el.fill;
    if(el.type==='ellipse')d.style.borderRadius='50%';
    if(el.type==='round')d.style.borderRadius='24px';
  }
  return d;
}
function renderStage(){
  const w=$('#canvas');
  sc=Math.max(.1,Math.min((w.clientWidth-20)/W,(w.clientHeight-20)/H));
  const b=$('#box');b.style.width=W*sc+'px';b.style.height=H*sc+'px';
  stage.style.transform=`scale(${sc})`;
  stage.style.setProperty('--hs',Math.round(36/sc)+'px');
  stage.style.setProperty('--ow',(2.5/sc).toFixed(2)+'px');
  stage.style.background=cur().bg;
  stage.innerHTML='';
  cur().els.forEach(el=>{
    const n=makeNode(el);
    if(el.id===sel){n.classList.add('sel');const h=document.createElement('i');h.className='handle';n.appendChild(h)}
    stage.appendChild(n);
  });
}
function renderStrip(){
  const s=$('#strip');s.innerHTML='';
  S.slides.forEach((sl,i)=>{
    const d=document.createElement('button');
    d.className='thumb'+(i===S.cur?' on':'');d.dataset.a='goto';d.dataset.i=i;
    const m=document.createElement('div');m.className='mini';m.style.background=sl.bg;

function renderCtx(){
  const c=$('#ctx');const el=sel&&find(sel);

/* ---------- canvas interaction ---------- */
let drag=null,lastTap={id:null,t:0};
stage.addEventListener('pointerdown',e=>{
  const n=e.target.closest('.el');
  if(!n){if(sel){sel=null;renderCtx();renderStage()}return}
  const el=find(n.dataset.id);if(!el)return;
  const resize=e.target.classList.contains('handle');
  if(sel!==el.id){sel=el.id;renderCtx();renderStage()}
  drag={el,resize,x:e.clientX,y:e.clientY,ox:el.x,oy:el.y,ow:el.w,oh:el.h,moved:false,before:JSON.stringify(S)};
  try{stage.setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();
});
stage.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=(e.clientX-drag.x)/sc,dy=(e.clientY-drag.y)/sc;
  if(!drag.moved&&Math.hypot(dx,dy)*sc<6)return;
  drag.moved=true;
  const el=drag.el;
  if(drag.resize){
    el.w=Math.max(30,drag.ow+dx);
    el.h=el.type==='image'?el.w/el.ar:Math.max(30,drag.oh+dy);
  }else{el.x=drag.ox+dx;el.y=drag.oy+dy}
  const n=stage.querySelector(`[data-id="${el.id}"]`);
  if(n){n.style.left=el.x+'px';n.style.top=el.y+'px';n.style.width=el.w+'px';n.style.height=el.h+'px'}
});
function endDrag(){
  if(!drag)return;const d=drag;drag=null;
  if(d.moved){recordUndo(d.before);save();renderStrip()}
  else if(d.el.type==='text'&&!d.resize){
    const now=Date.now();
    if(lastTap.id===d.el.id&&now-lastTap.t<400){lastTap={id:null,t:0};openEdit()}
    else lastTap={id:d.el.id,t:now};
  }
}
stage.addEventListener('pointerup',endDrag);

function shrink(f){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(f),im=new Image();
    im.onload=()=>{
      const k=Math.min(1,1280/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
      res(c.toDataURL(f.type==='image/png'?'image/png':'image/jpeg',.86));
    };
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};
    im.src=u;
  });
}

  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const data=await shrink(f),im=new Image();

      const ar=im.width/im.height;let w=Math.min(560,im.width),h=w/ar;
      if(h>400){h=400;w=h*ar}
      addEl({type:'image',x:(W-w)/2,y:(H-h)/2,w,h,data,ar});
    };
    im.src=data;

};

  checkpoint();
  const sl={bg:cur().bg,els};
  S.slides.splice(S.cur+1,0,sl);S.cur++;sel=null;renderAll();save();closeSheet();
}
function dupSlide(){
  checkpoint();
  const c=JSON.parse(JSON.stringify(cur()));c.els.forEach(e=>e.id=uid());
  S.slides.splice(S.cur+1,0,c);S.cur++;sel=null;renderAll();save();closeSheet();
}
function moveSlide(d){
  const j=S.cur+d;if(j<0||j>=S.slides.length)return;
  checkpoint();
  [S.slides[S.cur],S.slides[j]]=[S.slides[j],S.slides[S.cur]];S.cur=j;renderAll();save();
}
function delSlide(){
  if(S.slides.length<2){toast(t('only'));return}
  checkpoint();
  S.slides.splice(S.cur,1);S.cur=Math.min(S.cur,S.slides.length-1);sel=null;renderAll();save();closeSheet();
}

function elAct(a){
  const el=sel&&find(sel);if(!el)return;
  const list=cur().els;
  if(!['smaller','bigger','bold','italic','underline','align','front','back','dup','del'].includes(a))return;
  checkpoint();
  if(a==='smaller'){el.size=Math.max(8,el.size-4)}
  else if(a==='bigger'){el.size=Math.min(200,el.size+4)}
  else if(a==='bold'){el.bold=!el.bold}
  else if(a==='italic'){el.italic=!el.italic}
  else if(a==='underline'){el.underline=!el.underline}
  else if(a==='align'){el.align={left:'center',center:'right',right:'left'}[el.align]||'center'}
  else if(a==='front'){list.splice(list.indexOf(el),1);list.push(el)}
  else if(a==='back'){list.splice(list.indexOf(el),1);list.unshift(el)}
  else if(a==='dup'){const c=Object.assign({},el,{id:uid(),x:el.x+24,y:el.y+24});list.push(c);sel=c.id}
  else if(a==='del'){list.splice(list.indexOf(el),1);sel=null}
  commit();
}

/* ---------- present mode ---------- */
let pi=0,presHist=false;
function drawPres(){
  const p=$('#pstage'),k=Math.min(innerWidth/W,innerHeight/H),sl=S.slides[pi];
  p.style.transform=`scale(${k})`;p.style.left=(innerWidth-W*k)/2+'px';p.style.top=(innerHeight-H*k)/2+'px';
  p.style.background=sl.bg;p.innerHTML='';
  sl.els.forEach(e=>p.appendChild(makeNode(e)));
  $('#pnum').textContent=(pi+1)+' / '+S.slides.length;
}
function present(){
  closeSheet();pi=S.cur;$('#pres').classList.add('on');drawPres();
  history.pushState({p:1},'');presHist=true;
}
function closePres(fromPop){
  $('#pres').classList.remove('on');
  if(presHist&&!fromPop){presHist=false;history.back()}else presHist=false;
}
window.addEventListener('popstate',()=>{if($('#pres').classList.contains('on'))closePres(true)});
window.addEventListener('resize',()=>{if($('#pres').classList.contains('on'))drawPres()});
function pnext(){if(pi<S.slides.length-1){pi++;drawPres()}else closePres()}
function pprev(){if(pi>0){pi--;drawPres()}}
let px=0;
$('#pres').addEventListener('pointerdown',e=>{px=e.clientX});
$('#pres').addEventListener('pointerup',e=>{
  if(e.target.closest('#pclose'))return;
  const dx=e.clientX-px;
  if(Math.abs(dx)>50){dx<0?pnext():pprev()}
  else{e.clientX<innerWidth/3?pprev():pnext()}
});
$('#pclose').addEventListener('click',()=>closePres());
document.addEventListener('keydown',e=>{
  if($('#pres').classList.contains('on')){
    if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();pnext()}
    else if(e.key==='ArrowLeft'){e.preventDefault();pprev()}
    else if(e.key==='Escape')closePres();
    return;
  }
  if(e.target.closest('textarea,input,select,[contenteditable="true"]'))return;
  if((e.ctrlKey||e.metaKey)&&!e.altKey){
    const k=e.key.toLowerCase();
    if(k==='z'){e.preventDefault();e.shiftKey?redo():undo()}
    else if(k==='y'){e.preventDefault();redo()}
  }
});

/* ---------- export to .pptx ---------- */
async function deliver(b64){
  const name='Presentation-'+new Date().toISOString().slice(0,10)+'.pptx';
  const C=window.Capacitor;
  if(C&&C.isNativePlatform&&C.isNativePlatform()){
    const P=C.Plugins;
    const r=await P.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});
    await P.Share.share({title:name,url:r.uri,dialogTitle:name});
  }else{
    const bin=atob(b64),u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    const blob=new Blob([u],{type:'application/vnd.openxmlformats-officedocument.presentationml.presentation'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }
}
async function exportPptx(){
  if(!window.PptxGenJS){toast(t('liberr'));return}
  toast(t('exporting'),true);
  try{
    const p=new PptxGenJS();p.layout='LAYOUT_16x9';p.title='Presentation';
    const k=1/96,hex=c=>String(c).replace('#','').toUpperCase();
    S.slides.forEach(sl=>{
      const s=p.addSlide();s.background={color:hex(sl.bg)};
      sl.els.forEach(el=>{
        const pos={x:el.x*k,y:el.y*k,w:el.w*k,h:el.h*k};
  if(el.type==='text'){
          s.addText(el.text,Object.assign({},pos,{fontSize:Math.max(1,Math.round(el.size*.75)),color:hex(el.color),bold:!!el.bold,
            italic:!!el.italic,underline:!!el.underline,align:el.align,valign:'middle',fontFace:el.font||'Arial',margin:0,rtlMode:/[\u0600-\u06FF]/.test(el.text)}));
        }else if(el.type==='image'){
          s.addImage(Object.assign({data:el.data},pos));
        }else{
          const st=el.type==='ellipse'?p.ShapeType.ellipse:el.type==='round'?p.ShapeType.roundRect:p.ShapeType.rect;
          s.addShape(st,Object.assign({},pos,{fill:{color:hex(el.fill)},line:{color:hex(el.fill),width:0},rectRadius:.25}));
        }
      });
    });
    const b64=await p.write({outputType:'base64'});
    await deliver(b64);hideToast();
  }catch(err){console.error(err);toast(t('exportErr'))}
}

/* ---------- click router ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  if(b.matches('select'))return;
  const a=b.dataset.a;
  switch(a){
    case 'present':present();break;
    case 'export':exportPptx();break;
    case 'undo':undo();break;
    case 'redo':redo();break;
    case 'templates':openTemplates();break;
    case 'addtext':addText();break;
    case 'shape':openShapes();break;
    case 'image':$('#file').click();break;
    case 'theme':openThemes();break;
    case 'slide':openSlideMenu();break;
    case 'close':closeSheet();break;
    case 'goto':S.cur=+b.dataset.i;sel=null;renderAll();save();break;
    case 'addslide':openLayouts();break;
    case 'newslide':openLayouts();break;
    case 'layout':newSlide(b.dataset.layout);break;
    case 'addtemplate':addTemplate(b.dataset.template);break;
    case 'addshape':addShape(b.dataset.s);break;
    case 'settheme':applyTheme(+b.dataset.i);break;
    case 'slidebg':openColor(c=>{cur().bg=c;commit()});break;
    case 'dupslide':dupSlide();break;
    case 'mvl':moveSlide(-1);break;
    case 'mvr':moveSlide(1);break;
    case 'delslide':delSlide();break;
    case 'sw':window._colorCb&&window._colorCb(b.dataset.c);break;
    case 'color':{
      const el=sel&&find(sel);if(!el)break;
      openColor(c=>{if(el.type==='text')el.color=c;else el.fill=c;commit()});break;
    }
    case 'edit':openEdit();break;
    default:elAct(a);
  }
});
document.addEventListener('change',e=>{
  const b=e.target;
  if(!b.matches('#ctx select[data-a="font"]'))return;
  const el=sel&&find(sel);if(!el||el.type!=='text'||(el.font||'Arial')===b.value)return;
  checkpoint();el.font=b.value;commit();
});
$('#lang').addEventListener('click',()=>{S.lang=S.lang==='ar'?'en':'ar';save();applyLang()});

/* ---------- start ---------- */
applyLang();renderAll();
})();
</script>
